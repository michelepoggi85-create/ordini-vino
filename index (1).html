<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordine bottiglie</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fbf9f8);--tx:var(--tg-theme-text-color,#1d1a1b);--mut:var(--tg-theme-hint-color,#7b7376);--sf:var(--tg-theme-secondary-bg-color,#f1ecea);--ac:#8c2f4b;--ln:rgba(127,127,127,.28)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 130px}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
label.f{display:block;font-weight:600;margin:0 0 6px}
select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:11px 12px}
.sel{margin-bottom:20px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0 13px 12px;border-bottom:1px solid var(--ln);border-left:3px solid transparent}
.row.on{border-left-color:var(--ac)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600}
.nm span{color:var(--mut);font-size:14px}
.st{display:flex;align-items:center;gap:4px}
.st button{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:22px;line-height:1}
.st button:focus-visible,.go:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.st output{min-width:30px;text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.note{margin-top:20px}
textarea{resize:vertical;min-height:70px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:560px;margin:0 auto}
.tot{color:var(--mut);margin:0 0 8px;font-size:14px;min-height:20px}
.go{width:100%;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;padding:14px}
.go:disabled{opacity:.4}
.msg{background:var(--sf);border-radius:12px;padding:16px;margin-top:8px}
.err{color:#b3261e;margin:10px 0 0;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Ordine bottiglie</h1>
  <p class="sub" id="sub">Caricamento…</p>
  <section id="form" class="hide">
    <div class="sel hide" id="selBox">
      <label class="f" for="cli">Per quale cliente?</label>
      <select id="cli"></select>
    </div>
    <div id="list"></div>
    <div class="note">
      <label class="f" for="note">Note (facoltative)</label>
      <textarea id="note" placeholder="Es. consegna entro venerdì"></textarea>
    </div>
  </section>
  <section id="done" class="hide">
    <div class="msg"><b id="doneT"></b><p id="doneS" style="margin:6px 0 0"></p></div>
  </section>
  <section id="fail" class="hide">
    <div class="msg"><b>Non riesco a caricare i dati.</b><p style="margin:6px 0 12px">Controlla la connessione e riprova.</p><button class="go" id="retry">Riprova</button></div>
  </section>
</main>
<div class="bar hide" id="bar"><div>
  <p class="tot" id="tot"></p>
  <button class="go" id="go" disabled>Invia ordine</button>
  <p class="err hide" id="err"></p>
</div></div>
<script>
// Incolla qui l’indirizzo del webhook di Make. Finché resta così, la pagina funziona in modalità prova.
const CONFIG={WEBHOOK:"INCOLLA_QUI_URL_WEBHOOK_MAKE",BT:6};
// Nomi dei vini: devono coincidere con quelli della tabella Vini su Airtable.
let VINI=[
 {n:"Sirenella",d:"Custoza DOC"},
 {n:"Pal del Vo",d:"Bardolino Classico DOC"},
 {n:"Profetessa",d:"Lugana DOC"},
 {n:"Ripatico",d:"Rosso Verona IGT"},
 {n:"Bennie",d:"Chiaretto di Bardolino DOC"},
 {n:"Hanghelos",d:"Rosso Verona IGT"},
 {n:"Melsinea",d:"Garda DOC rosato brut"}
];
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);
const uid=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?String(tg.initDataUnsafe.user.id):"";
const demo=CONFIG.WEBHOOK.indexOf("INCOLLA")===0;
let q=[],isRep=false;

async function call(p){
  if(demo){
    await new Promise(r=>setTimeout(r,350));
    return p.azione==="init"
      ?{nome:"Michele",ruolo:"rappresentante",clienti:[{id:"1",nome:"Ristorante Al Lago"},{id:"2",nome:"Trattoria da Gino"}]}
      :{ok:true,numero:"prova"};
  }
  const b=new URLSearchParams();
  for(const k in p)b.append(k,typeof p[k]==="string"?p[k]:JSON.stringify(p[k]));
  b.append("telegram_id",uid);
  b.append("init_data",tg?tg.initData:"");
  const r=await fetch(CONFIG.WEBHOOK,{method:"POST",body:b});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}

function render(){
  const list=$("list");list.innerHTML="";
  VINI.forEach((v,i)=>{
    const row=document.createElement("div");row.className="row"+(q[i]?" on":"");
    row.innerHTML='<div class="nm"><b></b><span></span></div><div class="st"><button type="button" aria-label="Meno"></button><output>0</output><button type="button" aria-label="Più"></button></div>';
    row.querySelector("b").textContent=v.n;
    row.querySelector("span").textContent=v.d;
    const [m,p]=row.querySelectorAll("button");m.textContent="−";p.textContent="+";
    row.querySelector("output").textContent=q[i];
    m.onclick=()=>{if(q[i]>0){q[i]--;render();}};
    p.onclick=()=>{q[i]++;render();};
    list.appendChild(row);
  });
  const c=q.reduce((a,b)=>a+b,0);
  $("tot").textContent=c?c+(c===1?" cartone":" cartoni")+" ("+c*CONFIG.BT+" bottiglie)":"Scegli almeno un cartone";
  $("go").disabled=!c||(isRep&&!$("cli").value);
}

async function init(){
  ["form","bar","done","fail"].forEach(i=>$(i).classList.add("hide"));
  $("sub").textContent="Caricamento…";
  try{
    const d=await call({azione:"init"});
    if(d.vini)VINI=d.vini;
    q=VINI.map(()=>0);
    isRep=d.ruolo==="rappresentante";
    $("sub").textContent=(d.nome?d.nome+", s":"S")+"cegli i cartoni (da "+CONFIG.BT+" bottiglie).";
    if(isRep){
      const s=$("cli");s.innerHTML="";
      (d.clienti||[]).forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.nome;s.appendChild(o);});
      $("selBox").classList.remove("hide");
    }
    $("form").classList.remove("hide");$("bar").classList.remove("hide");
    render();
  }catch(e){$("sub").textContent="";$("fail").classList.remove("hide");}
}

$("cli").onchange=render;
$("retry").onclick=init;
$("go").onclick=async()=>{
  const righe=VINI.map((v,i)=>({vino:v.n,cartoni:q[i],bottiglie:q[i]*CONFIG.BT})).filter(r=>r.cartoni>0);
  const b=$("go");b.disabled=true;b.textContent="Invio in corso…";$("err").classList.add("hide");
  try{
    const d=await call({azione:"ordine",cliente_id:isRep?$("cli").value:"",righe:righe,note:$("note").value.trim()});
    if(!d.ok)throw new Error(d.errore||"");
    $("form").classList.add("hide");$("bar").classList.add("hide");
    $("sub").textContent="";
    $("doneT").textContent="Ordine inviato"+(d.numero?" (n. "+d.numero+")":"");
    $("doneS").textContent="Riceverai la conferma qui su Telegram.";
    $("done").classList.remove("hide");
    if(tg)setTimeout(()=>tg.close(),2500);
  }catch(e){
    b.textContent="Invia ordine";b.disabled=false;
    $("err").textContent="Invio non riuscito. Riprova tra qualche istante.";
    $("err").classList.remove("hide");
  }
};
init();
</script>
</body>
</html>
